<section id="skills">
    <div class="container">

    <app-section-title
        number="02"
        label="Skills"
        title="Technologies I work with"
    />

    <div class="skills-grid">
        @for (group of skillGroups; track group.title) {
        <article class="skill-group">
            <h3>{{ group.title }}</h3>
            <app-tag-list [tags]="group.skills" />
        </article>
        }
    </div>

    </div>
</section>
